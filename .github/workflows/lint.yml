name: Lint

on:
  workflow_call:
    inputs:
      node-version-file:
        type: string
        default: .nvmrc
      lint-command:
        type: string
        default: npm run lint
      # Optional "tool exercised nowhere else" check: regenerate committed assets and fail
      # if the working tree under `generated-assets-path` differs afterwards (diffs and
      # untracked files). Leave `generated-assets-command` empty to skip it.
      generated-assets-command:
        type: string
        default: ""
      generated-assets-path:
        type: string
        default: ""
      # Newline-separated paths or globs that must exist and be non-empty after regeneration.
      generated-assets-required-files:
        type: string
        default: ""
      # Workflow checks: actionlint (syntax, expressions, shellcheck on `run:` blocks) and
      # zizmor (workflow security audits, default persona). On by default.
      workflow-checks:
        type: boolean
        default: true
      # gitleaks over the full git history. On by default.
      secret-scan:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # gitleaks scans the whole history, so it needs more than the default depth of 1.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - name: Lint
        env:
          COMMAND: ${{ inputs.lint-command }}
        run: eval "$COMMAND"
      - name: zizmor
        if: inputs.workflow-checks
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: v1.30.1
          # Fail the job on findings instead of uploading SARIF, which needs
          # `security-events: write`.
          advanced-security: false
          annotations: true
      - name: actionlint
        if: inputs.workflow-checks
        run: |
          curl -fsSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP" actionlint
          rm actionlint.tar.gz
          "$RUNNER_TEMP/actionlint" -color
      - name: gitleaks
        if: inputs.secret-scan
        run: |
          curl -fsSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks" git --redact --exit-code 1 --no-banner .
      - name: Generated assets regenerate cleanly
        if: inputs.generated-assets-command != ''
        env:
          COMMAND: ${{ inputs.generated-assets-command }}
          ASSETS_PATH: ${{ inputs.generated-assets-path }}
          REQUIRED_FILES: ${{ inputs.generated-assets-required-files }}
        run: |
          test -n "$ASSETS_PATH" || { echo "generated-assets-path is required with generated-assets-command"; exit 1; }
          eval "$COMMAND"
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            matches=$(compgen -G "$pattern" || true)
            [ -n "$matches" ] || { echo "missing: $pattern"; exit 1; }
            for f in $matches; do
              test -s "$f" || { echo "empty: $f"; exit 1; }
            done
          done <<< "$REQUIRED_FILES"
          # --porcelain also catches untracked files (e.g. a new size added upstream).
          test -z "$(git status --porcelain -- "$ASSETS_PATH")" || { git status --short -- "$ASSETS_PATH"; git diff -- "$ASSETS_PATH"; exit 1; }
