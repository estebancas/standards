name: Unit tests + build

on:
  workflow_call:
    inputs:
      node-version-file:
        type: string
        default: .nvmrc
      build-command:
        type: string
        default: npm run build
      test-command:
        type: string
        default: npm test
      dist-path:
        type: string
        default: dist

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      - name: Build
        env:
          COMMAND: ${{ inputs.build-command }}
        run: eval "$COMMAND"
      - name: Test
        env:
          COMMAND: ${{ inputs.test-command }}
        run: eval "$COMMAND"
      # The size and e2e workflows download this artifact; callers must run them after this one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: ${{ inputs.dist-path }}
          retention-days: 7
