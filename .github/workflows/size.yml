name: Bundle size

on:
  workflow_call:
    inputs:
      node-version-file:
        type: string
        default: .nvmrc
      size-command:
        type: string
        default: npm run size
      dist-path:
        type: string
        default: dist

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      # Artifact produced by test-build.yml in the same run; the caller must `needs` that job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: ${{ inputs.dist-path }}
      - name: Size
        env:
          COMMAND: ${{ inputs.size-command }}
        run: eval "$COMMAND"
