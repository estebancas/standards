name: Bundle size

on:
  workflow_call:
    inputs:
      node-version-file:
        type: string
        default: .nvmrc
      size-command:
        type: string
        default: npm run size
      dist-path:
        type: string
        default: dist

permissions:
  contents: read

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm
      - run: npm ci
      # Artifact produced by test-build.yml in the same run; the caller must `needs` that job.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: ${{ inputs.dist-path }}
      - name: Size
        env:
          COMMAND: ${{ inputs.size-command }}
        run: eval "$COMMAND"
